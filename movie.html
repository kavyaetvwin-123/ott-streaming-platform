<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Details | OTT Streaming Platform</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>OTT Streaming Platform</h1>

</header>

<div class="movie-container">

    <div class="movie-card">

        <img
            id="poster"
            src="https://picsum.photos/350/500"
            alt="Movie Poster"
            class="poster">

        <div class="details">

            <h2 id="title">Loading...</h2>

            <p id="genre"></p>

            <p id="language"></p>

            <p id="duration"></p>

            <button id="watchBtn">

                ▶ Watch Now

            </button>

        </div>

    </div>

</div>

<script src="movie.js"></script>

</body>

</html>
