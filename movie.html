<!DOCTYPE html>
<html>

<head>

    <title>OTT Player</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <h1>OTT Streaming</h1>

    </header>

    <div class="movie-container">

        <div class="movie-card">

            <img
                src="https://picsum.photos/350/500"
                alt="Poster"
                class="poster">

            <div class="details">

                <h2 id="title"></h2>

                <p id="genre"></p>

                <p id="language"></p>

                <p id="duration"></p>

                <button id="watchBtn">

                    ▶ Watch Now

                </button>

            </div>

        </div>

    </div>

    <script src="movie.js"></script>

</body>

</html>
