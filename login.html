<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OTT Streaming Platform | Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="login-card">

        <h3 class="logo">
            OTT STREAMING PLATFORM
        </h3>

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Sign in to continue watching.
        </p>

        <div class="input-group">

            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email">

        </div>

        <div class="input-group">

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password">

        </div>

        <button onclick="login()">

            Login

        </button>

        <a href="#" class="forgot">

            Forgot Password?

        </a>

        <div class="divider">

            <span>OR</span>

        </div>

        <div class="signup">

            Don't have an account?

            <a href="register.html">

                Create Account

            </a>

        </div>

        <p id="message"></p>

        <div class="footer">

            © 2026 OTT Streaming Platform

        </div>

    </div>

</div>

<script src="login.js"></script>

</body>

</html>
